   SETUP — submissions
   1. Make a free form at formspree.io.

/* Layout: red masthead strip; headline beside a taped deadline note;
   below, a signed letter on the left and the feedback sheet on the right. */
:root {
  --board: #ebebed;      /* page: a grey pinboard */
  --paper: #ffffff;
  --ink: #171518;
  --muted: #6c676b;
  --line: #e1dee1;
  --red: #d6001c;        /* Sciences Po red */
  --red-deep: #9a0014;
  --tint: #fdecee;
  --tape: rgba(255, 255, 255, 0.62);

  --display: "Funnel Display", "Arial Black", "Helvetica Neue", sans-serif;
  --sans: "Funnel Sans", "Helvetica Neue", Arial, sans-serif;
  --hand: "Reenie Beanie", "Bradley Hand", "Segoe Print", cursive;
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--board); color: var(--ink);
  font-family: var(--sans); font-size: 1.0625rem; line-height: 1.55;
  padding-inline: 20px;
  padding-block: 0 calc(env(safe-area-inset-bottom, 0px) + 72px);
}
[hidden] { display: none !important; }
p { margin: 0; }
.page { max-width: 1080px; margin: 0 auto; }

/* ---------- masthead ---------- */
.mast {
  margin-inline: -20px; padding-inline: 20px;
  padding-block: calc(env(safe-area-inset-top, 0px) + 12px) 12px;
  background: var(--red); color: #fff;
}
.mast .page { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; }
.mast .who { font-weight: 600; font-size: .9rem; }
.mast .who span { font-weight: 400; opacity: .85; }
.mast nav { display: flex; gap: 20px; }
.mast nav button {
  font: inherit; font-size: .9rem; font-weight: 500; color: #fff; background: none; border: 0; padding: 2px 0;
  cursor: pointer; opacity: .78; border-bottom: 2px solid transparent;
}
.mast nav button:hover { opacity: 1; }
.mast nav button[aria-current="page"] { opacity: 1; border-bottom-color: #fff; }
.mast nav button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

/* ---------- headline row ---------- */
.top {
  display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 40px 56px;
  align-items: center; padding-block: 64px 56px;
}
h1 {
  font-family: var(--display); font-weight: 800; margin: 0;
  font-size: clamp(3rem, 9vw, 6.6rem); line-height: .88; letter-spacing: -0.05em;
  text-wrap: balance;
}
.mark { position: relative; display: inline-block; color: var(--red); }
.mark svg { position: absolute; left: -2%; bottom: -0.15em; width: 104%; height: .28em; overflow: visible; }
.mark path { fill: none; stroke: var(--red); stroke-width: 3.5; stroke-linecap: round; stroke-dasharray: 220; animation: draw 0.9s .25s ease-out backwards; }
@keyframes draw { from { stroke-dashoffset: 220; } }

/* paper note with tape */
.note {
  position: relative; background: var(--paper); padding: 30px 26px 26px;
  box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 10px 24px -14px rgba(30,20,25,.35);
  transform: rotate(1.6deg);
}
.note::before {
  content: ""; position: absolute; top: -12px; left: 50%; width: 92px; height: 24px;
  translate: -50% 0; rotate: -3deg; background: var(--tape);
  box-shadow: 0 0 0 1px rgba(0,0,0,.05);
}
.note .k { font-size: .82rem; font-weight: 600; color: var(--red); }
.note .big {
  font-family: var(--display); font-weight: 800; font-size: 2.7rem; line-height: 1; letter-spacing: -0.04em;
  font-variant-numeric: tabular-nums; margin-block: 6px 4px; white-space: nowrap;
}
.note .big small { font-size: .5em; font-weight: 700; letter-spacing: -0.01em; color: var(--muted); margin-inline: .08em .25em; }
.note .sub { font-weight: 600; }
.note .rule { height: 1px; background: var(--line); margin-block: 16px; }
.note .fine { font-size: .9rem; color: var(--muted); line-height: 1.5; }
.note .fine b { color: var(--ink); font-weight: 600; }

/* ---------- letter + sheet ---------- */
.body { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 48px 64px; align-items: start; }
.letter { position: sticky; top: 28px; display: grid; gap: 16px; }
.letter .lead { font-family: var(--display); font-weight: 500; font-size: 1.45rem; line-height: 1.3; letter-spacing: -0.015em; }
.letter .more { color: var(--muted); }
.sig { display: grid; gap: 0; margin-top: 4px; }
.sig .hand { font-family: var(--hand); font-size: 2.6rem; line-height: .9; color: var(--red); transform: rotate(-3deg); transform-origin: left; }
.sig .role { font-size: .85rem; color: var(--muted); }

/* the feedback sheet: one page of paper with a folded corner */
.sheet {
  --c: 30px;
  position: relative; background: var(--paper); padding: 40px 40px 36px;
  clip-path: polygon(0 0, calc(100% - var(--c)) 0, 100% var(--c), 100% 100%, 0 100%);
  filter: drop-shadow(0 12px 18px rgba(30,20,25,.10));
}
.sheet::after {
  content: ""; position: absolute; top: 0; right: 0; width: var(--c); height: var(--c);
  background: linear-gradient(to bottom left, transparent 50%, #d9d5d8 50%);
}
form { display: grid; gap: 44px; }
.part { display: grid; gap: 12px; }
.part h2, .field label {
  font-family: var(--display); font-weight: 700; font-size: 1.55rem; letter-spacing: -0.03em; line-height: 1.15; margin: 0;
}
.help { color: var(--muted); font-size: .93rem; }
